<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme player</title>
<style>
  :root { color-scheme: dark; --ink: #e8e4f4; --muted: #8d86a6; --panel: #0b0b12; --paper: #e9e6ef; }
  body { margin: 0; background: #050508; color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  main { max-inline-size: 1200px; margin-inline: auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-block: 12px; }
  button { font: inherit; color: var(--ink); background: #1b1830; border: 1px solid #3a3360; border-radius: 6px;
           padding: 6px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: #4b1fb8; border-color: #8a45ff; }
  label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  canvas { display: block; max-inline-size: 100%; }
</style>
<main>
  <h1 id="title">Theme player</h1>
  <canvas id="stage" width="720" height="260"></canvas>
  <div class="controls" id="states"></div>
  <div class="controls">
    <label>Voice level <input id="level" type="range" min="0" max="1" step="0.01" value="0.4"></label>
    <label><input id="auto" type="checkbox" checked> Wobble the voice</label>
    <label>Sheet scale <select id="scale"><option>1</option><option>4</option></select></label>
  </div>
  <canvas id="sheet"></canvas>
</main>
<script src="presence.js"></script>
<script>
// A standalone player for theme packs baked by the forge, on presence.js (the same engine the phone app can load).
// Open it as player.html?pack=nova; add &mode=phone for the phone view. No network, no framework.
// Preview modes, used by preview.py: ?mode=sheet&scale=1&t=0.3, ?mode=film&state=thinking&seconds=8&fps=30, and
// &layout=phone on a film for phone-sized frames.
const Q = new URLSearchParams(location.search);
const PACK = Q.get("pack") || "nova";
// A pack outside the repo comes as &base=<its folder's URL>, such as a user's pack in ~/.config/rook/themes.
const BASE = Q.get("base") || `../${PACK}/`;
const REAL = 140;                  // The presence's real size on the desktop, in CSS pixels.
const DARK = "#0b0b12", LIGHT = "#e9e6ef";
const SAMPLE_THREAD = "forge: theme icons";
const level = (now) => 0.5 + 0.5 * Math.sin(now * 5) * Math.sin(now * 1.3);

async function loadAll() {
  const { pack, icons } = await ThemePresence.loadPack(BASE);
  Object.values(icons).forEach((i) => i.ready());
  await Promise.all(Object.values(icons).map((i) => i.loading));
  return { pack, icons };
}

// The contact sheet: every icon at one phase, on a dark and a light half, labelled, every layer drawn.
// `phase(icon)` gives the seconds to show for each icon.
function drawSheet(canvas, pack, icons, scale, phase) {
  const names = Object.keys(icons);
  const tile = REAL * scale, pad = 12 * scale, label = 18 * Math.max(1, scale / 2);
  const cols = scale > 1 ? 4 : 8, rows = Math.ceil(names.length / cols);
  const w = cols * (tile + pad) + pad, h = rows * (tile + pad + label) + pad;
  canvas.width = w * 2; canvas.height = h;
  const ctx = canvas.getContext("2d");
  [DARK, LIGHT].forEach((bg, half) => {
    ctx.fillStyle = bg; ctx.fillRect(half * w, 0, w, h);
    names.forEach((n, i) => {
      const x = half * w + pad + (i % cols) * (tile + pad) + tile / 2, y = pad + Math.floor(i / cols) * (tile + pad + label) + tile / 2;
      const ic = icons[n];
      (ic.layers || [0]).forEach((_, l) => ic.draw(ctx, x, y, tile, phase(ic), l));
      ctx.fillStyle = half ? "#3a3360" : "#8d86a6";
      ctx.font = `${12 * Math.max(1, scale / 2)}px system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(n, x, y + tile / 2 + label * 0.8);
    });
  });
}

// One frame of the stage: the presence on a dark half and a light half.
function drawStage(ctx, w, h, presences, now, size) {
  ctx.clearRect(0, 0, w, h);
  [DARK, LIGHT].forEach((bg, half) => {
    ctx.fillStyle = bg; ctx.fillRect(half * w / 2, 0, w / 2, h);
    presences[half].draw(ctx, half * w / 2 + w / 4, h / 2, size, now);
  });
}

// One frame of the phone view: a 390 x 844 screen with the presence at the top, as the phone app seats it, and a
// few lines of answer below so its scale reads. `k` is the pixel density.
function drawPhone(ctx, presence, now, bg, k = 1) {
  const W = 390 * k, H = 844 * k;
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  presence.draw(ctx, W / 2, 190 * k, 300 * k, now);
  ctx.fillStyle = bg === DARK ? "#2a2540" : "#cfc9dc";
  for (let i = 0; i < 6; i++) {
    const y = (380 + i * 34) * k, w = (i % 3 === 2 ? 180 : 320) * k;
    ctx.beginPath(); ctx.roundRect((390 * k - 330 * k) / 2, y, w, 14 * k, 7 * k); ctx.fill();
  }
}

// A scripted run for films: a list of [seconds, state].
const SCRIPTS = {
  thinking: [[0, "thinking"]],
  listening: [[0, "listening"], [4, "rest"], [4.6, "listening"]],
  phone: [[0, "rest"], [1.5, "listening"], [4.5, "thinking"], [10.5, "send"], [13, "speaking"], [16, "rest"]],
  tour: [[0, "rest"], [2, "listening"], [5, "transcribing"], [6.5, "thinking"], [12.5, "send"], [15, "open"],
         [17.5, "speaking"], [20.5, "timer"], [22.5, "waiting"], [24.5, "error"], [26.5, "rest"]],
};

// Dispatch proofs, with the designer's names and outcomes (stage/dispatch.md), so the two sheets compare directly.
const THREADS = [
  { name: "Rook build (Opus)", sub: "rook · oak" }, { name: "Phone collapse" }, { name: "Invoice rounding fix" },
  { name: "QA pass on staging" }, { name: "Overnight research" }, { name: "Mac milestone 1" },
];
const LONG = [{ name: "Rook build (Opus)" }, { name: "shopfront-web-react-v3: invoice total rounding" }];
const OUTCOMES = { 1: ["landed"], 2: ["landed", "landed"], 3: ["landed", "landed", "unknown"],
                   4: ["landed", "landed", "landed", "not-landed"], 6: ["landed", "landed", "landed", "not-landed", "landed", null] };
const SEND_AT = 0.6;
// Steps a presence one frame: sends at SEND_AT, and each outcome 0.35 s after its name arrives.
function stepSend(p, list, outs, now) {
  if (now >= SEND_AT && !p._sent) { p.send(list, now); p._sent = true; }
  if (p.dispatch) p.dispatch.items.forEach((it, j) => {
    if (!it.outcome && outs[j] && now >= SEND_AT + it.leave + 0.56 + 0.35) p.sendOutcome(j, outs[j], now);
  });
}

async function main() {
  const { pack, icons } = await loadAll();
  const mode = Q.get("mode");
  const make = () => { const p = new ThemePresence.Presence(pack, icons); p.label = SAMPLE_THREAD; p.setState("rest", 0); return p; };
  await document.fonts.load('600 21px "IBM Plex Sans"');
  if (mode === "compare") {
    // Before and after, on the desktop's layout: the rest anchor sits 164 px above the working icons. Left: main's
    // old rules (every icon jumps with the state; flash and braiding at 24 fps, if the pack holds them as *_old).
    // Right: the new rules (each icon fades at its own anchor; the one-shots at 60 fps).
    const fps = +(Q.get("fps") || 60), scale = +(Q.get("scale") || 1);
    const start = +(Q.get("start") || 0), secs = +(Q.get("seconds") || 4);
    const W = Math.round(300 * scale), H = Math.round(430 * scale), cy = Math.round(0.64 * H);
    const oldPack = JSON.parse(JSON.stringify(pack));
    if (icons.flash_old) oldPack.transition.flash = "flash_old";
    if (icons.dispatch_in_old && oldPack.icons.dispatch?.intro) oldPack.icons.dispatch.intro.icon = "dispatch_in_old";
    for (const n of ["flash_old", "dispatch_in_old"]) delete pack.icons[n];
    const before = new ThemePresence.Presence(oldPack, icons), after = make();
    before.setState("rest", 0);
    for (const p of [before, after]) p.restDy = -164 * scale;
    before.legacyJump = true;
    const steps = [[0, "rest"], [1.5, "listening"], [3.5, "thinking"], [8.0, "speaking"], [10.0, "rest"], [11.5, "send"]];
    const c = document.createElement("canvas"); c.width = W * 2; c.height = H;
    const ctx = c.getContext("2d");
    const out = [];
    for (let i = 0; i < Math.round((start + secs) * fps); i++) {
      const now = i / fps;
      const step = steps.filter(([at]) => at <= now).pop()[1];
      ctx.fillStyle = DARK; ctx.fillRect(0, 0, c.width, H);
      [before, after].forEach((p, half) => {
        if (step === "send") { if (!p._sent) { p.send(THREADS.slice(0, 2), now); p._sent = true; } }
        else p.setState(step, now);
        p.level = level(now);
        ctx.save(); ctx.beginPath(); ctx.rect(half * W, 0, W, H); ctx.clip();
        p.draw(ctx, half * W + W / 2, cy, REAL * scale, now);
        ctx.restore();
        ctx.fillStyle = "#8d86a6"; ctx.font = `${12 * scale}px system-ui, sans-serif`; ctx.textAlign = "left";
        ctx.fillText(half ? "after: anchors, 60 fps one-shots" : "before: main today", half * W + 10 * scale, 18 * scale);
      });
      ctx.fillStyle = "#1c1a28"; ctx.fillRect(W - 1, 0, 2, H);
      if (now >= start - 1e-6) out.push(c.toDataURL());
    }
    return out;
  }
  if (mode === "vfilm") {
    // Several icons side by side (&icon=a,b,c), dark above light, each driven by one level curve: &env is one value
    // per 1/60 s, such as a spoken clip's syllable envelope. Without it, a synthetic wobble.
    const names = (Q.get("icon") || "speak").split(","), scale = +(Q.get("scale") || 1), fps = +(Q.get("fps") || 60);
    const env = (Q.get("env") || "").split(",").filter(Boolean).map(Number);
    const start = +(Q.get("start") || 0), secs = +(Q.get("seconds") || 4);
    const tile = Math.round(REAL * scale), pad = Math.round(16 * scale), lab = Math.round(16 * scale);
    const c = document.createElement("canvas");
    c.width = names.length * (tile + pad) + pad; c.height = 2 * (tile + lab + pad) + pad;
    const ctx = c.getContext("2d");
    const out = [];
    for (let i = 0; i < Math.round((start + secs) * fps); i++) {
      const now = i / fps;
      if (now < start - 1e-6) continue;
      const lv = env.length ? env[Math.min(env.length - 1, Math.round(now * 60))] : level(now);
      [DARK, LIGHT].forEach((bg, row) => {
        const y0 = row * (tile + lab + pad);
        ctx.fillStyle = bg; ctx.fillRect(0, y0, c.width, tile + lab + pad + (row ? pad : 0));
        names.forEach((n, j) => {
          const ic = icons[n], x = pad + j * (tile + pad) + tile / 2, y = y0 + pad + tile / 2;
          (ic.layers || ["main"]).forEach((layer, k) => {
            const v = ic.voice?.[layer], L = (a, b) => (a ?? 1) + ((b ?? 1) - (a ?? 1)) * lv;
            if (!v) return ic.draw(ctx, x, y, tile, now, k);
            ic.draw(ctx, x, y, tile, now, k, L(v.opacity?.[0], v.opacity?.[1]), L(v.scale?.[0], v.scale?.[1]), L(v.stretch?.[0], v.stretch?.[1]));
          });
          ctx.fillStyle = row ? "#3a3360" : "#8d86a6"; ctx.font = `${11 * Math.max(1, scale / 1.5)}px system-ui, sans-serif`;
          ctx.textAlign = "center"; ctx.fillText(n, x, y + tile / 2 + lab * 0.6);
        });
      });
      // The level, as a bar along the bottom.
      ctx.fillStyle = "#14121c"; ctx.fillRect(0, c.height - pad, c.width, pad);
      ctx.fillStyle = "#ff5bd8"; ctx.fillRect(0, c.height - pad, c.width * lv, pad * 0.5);
      out.push(c.toDataURL());
    }
    return out;
  }
  if (mode === "levels") {
    // One icon (or several, comma-separated) at voice levels 0, 0.5 and 1, on dark and light, at `scale`.
    const names = (Q.get("icon") || "speak").split(","), scale = +(Q.get("scale") || 1), t = +(Q.get("t") || 0.2);
    const levels = (Q.get("levels") || "0,0.5,1").split(",").map(Number), tile = Math.round(REAL * scale), pad = Math.round(14 * scale), lab = Math.round(18 * scale);
    const c = document.createElement("canvas");
    c.width = 2 * levels.length * (tile + pad) + pad; c.height = names.length * (tile + lab + pad) + pad;
    const ctx = c.getContext("2d");
    [DARK, LIGHT].forEach((bg, half) => { ctx.fillStyle = bg; ctx.fillRect(half * c.width / 2, 0, c.width / 2, c.height); });
    names.forEach((n, r) => {
      const ic = icons[n];
      levels.forEach((lv, j) => [0, 1].forEach((half) => {
        const x = half * c.width / 2 + pad + j * (tile + pad) + tile / 2, y = pad + r * (tile + lab + pad) + tile / 2;
        (ic.layers || ["main"]).forEach((layer, i) => {
          const v = ic.voice?.[layer];
          const L = (a, b) => (a ?? 1) + ((b ?? 1) - (a ?? 1)) * lv;
          if (!v) return ic.draw(ctx, x, y, tile, t * ic.duration(), i);
          ic.draw(ctx, x, y, tile, t * ic.duration(), i, L(v.opacity?.[0], v.opacity?.[1]), L(v.scale?.[0], v.scale?.[1]), L(v.stretch?.[0], v.stretch?.[1]));
        });
        ctx.fillStyle = half ? "#3a3360" : "#8d86a6"; ctx.font = `${11 * Math.max(1, scale / 2)}px system-ui, sans-serif`;
        ctx.textAlign = "center"; ctx.fillText(`${n}, level ${lv}`, x, y + tile / 2 + lab * 0.7);
      }));
    });
    return [c.toDataURL()];
  }
  if (mode === "dsheet") {
    // Every send count on one sheet, held after the last name has landed: dark on the left, light on the right.
    // Each presence is played frame by frame from rest, so its changes run as they would live.
    // With &stack=1 (for 1.6x, to stay under 2,400 px wide) light panels sit under dark ones instead of beside them.
    const scale = +(Q.get("scale") || 1), pw = Math.round(+(Q.get("panel") || 1000) * scale), ph = Math.round(190 * scale);
    const cases = [1, 2, 3, 4, 6, "long"], title = Math.round(22 * scale), stack = Q.get("stack") === "1";
    const c = document.createElement("canvas");
    c.width = stack ? pw : pw * 2; c.height = cases.length * (ph + title) * (stack ? 2 : 1);
    const ctx = c.getContext("2d");
    const off = document.createElement("canvas"); off.width = pw; off.height = ph;
    const octx = off.getContext("2d");
    cases.forEach((n, r) => {
      [DARK, LIGHT].forEach((bg, half) => {
        const p = make(), list = n === "long" ? LONG : THREADS.slice(0, n), outs = OUTCOMES[n] || [];
        const until = SEND_AT + 0.3 + 0.09 * (list.length - 1) + 0.56 + 0.9;
        for (let i = 0; i <= Math.round(until * 30); i++) {
          const now = i / 30;
          stepSend(p, list, outs, now);
          octx.fillStyle = bg; octx.fillRect(0, 0, pw, ph);
          p.draw(octx, pw / 2, ph / 2, REAL * scale, now);
        }
        const px = stack ? 0 : half * pw, py = (stack ? r * 2 + half : r) * (ph + title);
        ctx.drawImage(off, px, py + title);
        ctx.fillStyle = "#14121c"; ctx.fillRect(px, py, pw, title);
        ctx.fillStyle = "#cfc8e6"; ctx.font = `${13 * scale}px system-ui, sans-serif`; ctx.textBaseline = "middle";
        const label = { 1: "one send, landed", 2: "two sends", 3: "three: landed, landed, cannot tell",
                        4: "four: the fourth did not land", 6: "six: the last still pending", long: "a long name, cut" }[n];
        ctx.fillText(`Nova, ${label}${half ? " (light)" : ""}`, px + 10 * scale, py + title / 2);
      });
    });
    return [c.toDataURL()];
  }
  if (mode === "dfilm") {
    // A send of `n` threads, dark and light side by side, from rest through the send and back to rest.
    const n = Q.get("n") === "long" ? "long" : +(Q.get("n") || 1), fps = +(Q.get("fps") || 24), scale = +(Q.get("scale") || 1);
    const start = +(Q.get("start") || 0), secs = +(Q.get("seconds") || 4.2);
    const pw = Math.round(1000 * scale), ph = Math.round(190 * scale);
    const c = document.createElement("canvas"); c.width = pw * 2; c.height = ph;
    const ctx = c.getContext("2d");
    const halves = [DARK, LIGHT].map((bg) => {
      const o = document.createElement("canvas"); o.width = pw; o.height = ph;
      return { bg, p: make(), o, octx: o.getContext("2d") };
    });
    const list = n === "long" ? LONG : THREADS.slice(0, n), outs = OUTCOMES[n] || [];
    const out = [];
    for (let i = 0; i < Math.round((start + secs) * fps); i++) {
      const now = i / fps;
      halves.forEach((hf, half) => {
        stepSend(hf.p, list, outs, now);
        hf.octx.fillStyle = hf.bg; hf.octx.fillRect(0, 0, pw, ph);
        hf.p.draw(hf.octx, pw / 2, ph / 2, REAL * scale, now);
        ctx.drawImage(hf.o, half * pw, 0);
      });
      if (now >= start - 1e-6) out.push(c.toDataURL());
    }
    return out;
  }
  if (mode === "sheet") {
    const c = document.createElement("canvas");
    const t = +(Q.get("t") || 0.3);
    drawSheet(c, pack, icons, +(Q.get("scale") || 1), (ic) => t * ic.duration());
    return [c.toDataURL()];
  }
  if (mode === "film") {
    // Deterministic frames: a presence (or a single icon with ?icon=) at a fixed frame rate.
    const fps = +(Q.get("fps") || 30), secs = +(Q.get("seconds") || 4), size = +(Q.get("size") || REAL * 2);
    const phone = Q.get("layout") === "phone";
    const c = document.createElement("canvas");
    if (phone) { c.width = 390 * 2; c.height = 844; } else { c.width = size * 2 * 1.2; c.height = size * 1.2; }
    const ctx = c.getContext("2d");
    const ps = [make(), make()];
    const script = Q.get("icon") ? [[0, Q.get("icon")]] : SCRIPTS[Q.get("state") || "thinking"] || [[0, Q.get("state")]];
    const out = [];
    const start = +(Q.get("start") || 0);
    for (let i = 0; i < (start + secs) * fps; i++) {
      const now = i / fps;
      const step = script.filter(([at]) => at <= now).pop();
      ps.forEach((p) => { p.setState(step[1], now); p.level = level(now); });
      if (phone) {
        ctx.save(); drawPhone(ctx, ps[0], now, DARK); ctx.restore();
        ctx.save(); ctx.translate(390, 0); drawPhone(ctx, ps[1], now, LIGHT); ctx.restore();
      } else drawStage(ctx, c.width, c.height, ps, now, size);
      if (now >= start - 1e-6) out.push(c.toDataURL());
    }
    return out;
  }
  document.getElementById("title").textContent = `${pack.title} theme player`;
  if (mode === "phone") {
    // The phone view, through the same interface the phone app uses (RookPresence's): tap to listen or stop.
    document.querySelector("main").style.maxInlineSize = "390px";
    const stage = document.getElementById("stage");
    stage.style.inlineSize = "100%"; stage.style.blockSize = "300px"; stage.style.cursor = "pointer";
    document.getElementById("sheet").remove();
    const rook = ThemePresence.phone({ base: BASE });
    await rook.load(stage);
    let mood = "resting";
    stage.addEventListener("click", () => rook.set(mood = mood === "listening" ? "resting" : "listening"));
    const moods = [["resting"], ["listening"], ["transcribing"], ["thinking"], ["thinking", "sending", SAMPLE_THREAD],
                   ["thinking", "showing"], ["thinking", "timing"], ["speaking"], ["waiting"], ["error"], ["away"]];
    const bar = document.getElementById("states");
    moods.forEach(([m, k, line]) => {
      const b = document.createElement("button");
      b.textContent = k ? `${m}: ${k}` : m;
      b.onclick = () => rook.set(mood = m, k ?? null, line ?? null);
      bar.append(b);
    });
    setInterval(() => { if (document.getElementById("auto").checked) rook.setLevel(level(performance.now() / 1000)); else rook.setLevel(+document.getElementById("level").value); }, 50);
    return null;
  }
  // The desktop view: the stage on dark and on light, a button per state, the voice level, and the live sheet.
  const stage = document.getElementById("stage"), sctx = stage.getContext("2d");
  const ps = [make(), make()];
  const states = Object.keys(pack.states);
  const bar = document.getElementById("states");
  const set = (s) => {
    const now = performance.now() / 1000;
    ps.forEach((p) => p.setState(s, now));
    bar.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.textContent === s));
  };
  states.forEach((s) => { const b = document.createElement("button"); b.textContent = s; b.onclick = () => set(s); bar.append(b); });
  set(states.includes("rest") ? "rest" : states[0]);
  const sheet = document.getElementById("sheet"), scaleSel = document.getElementById("scale");
  const levelIn = document.getElementById("level"), auto = document.getElementById("auto");
  (function frame() {
    const now = performance.now() / 1000;
    const lv = auto.checked ? level(now) : +levelIn.value;
    if (auto.checked) levelIn.value = lv;
    ps.forEach((p) => (p.level = lv));
    drawStage(sctx, stage.width, stage.height, ps, now, REAL);
    drawSheet(sheet, pack, icons, +scaleSel.value, () => now);
    requestAnimationFrame(frame);
  })();
  return null;
}

main().then((out) => {
  if (!out) return;
  const pre = document.createElement("pre");
  pre.id = "forge";
  pre.textContent = JSON.stringify(out);
  document.body.append(pre);
}, (e) => {
  const pre = document.createElement("pre");
  pre.id = "forge";
  pre.textContent = JSON.stringify({ error: String(e.message || e) });
  document.body.append(pre);
});
</script>
