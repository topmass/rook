# Models for the agent memory system. Change a value here to swap a model.
# The memory model owns all in-session writes to .agent-memory folders.
MEMORY_MODEL=claude-opus-5-5
MEMORY_EFFORT=medium
# Nightly dream: analysts read the transcripts and propose changes. One writer per project decides and writes.
DREAM_ANALYZER_MODEL=claude-haiku-5-5
DREAM_ANALYZER_EFFORT=medium
DREAM_WRITER_MODEL=claude-sonnet-5-5
DREAM_WRITER_EFFORT=high
DREAM_PARALLEL=4
# Optional hard cap on total model runs (analysts plus writers) per nightly dream (minimum 2). Leave unset for unlimited nightly runs.
# DREAM_MAX_RUNS=
# Absolute path to the Claude Code CLI, recorded at install time for systemd's minimal PATH.
CLAUDE_BIN=
# Memory lives in the folder an agent starts in. A folder listed here is one project instead:
# every session that starts anywhere inside it uses that folder's memory. Separate several with ":".
PROJECT_ROOTS=
# Memory is off in a folder listed here, and in everything inside it. A session there gets no memory folder
# and no index, remember saves nothing, and the dream does not read its transcripts. Separate several with ":".
NO_MEMORY=
# Rook, the voice assistant, saves no session files. The dream reads its turn log instead,
# and files what it learns in the memory of the folder Rook starts in. A machine with no log skips this.
ROOK_TURN_LOG=~/.local/state/rook/turns.jsonl
ROOK_START_DIR=~/Work
